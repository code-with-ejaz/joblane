<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joblane – Remote and global jobs</title>
<meta name="description" content="Browse fresh remote and global jobs by location and category, with links to the original posting.">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--soft:#f3f4f6;--brand:#0f766e;--brand-d:#0b5a54;--tint:#e6f4f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:30}
h1,h2,h3,.logo{font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif;margin:0;line-height:1.2}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:#fff;border-bottom:1px solid var(--line);z-index:20}
.bar0{display:flex;align-items:center;gap:12px;padding:12px 16px}
.logo{font-size:1.45rem;font-weight:800;color:var(--brand);text-decoration:none}
.logo span{color:var(--ink)}
.sbox{flex:1;min-width:0}
.sbox input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--soft);min-height:44px}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:999px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.p:hover{background:var(--brand-d)}
.layout{display:block;padding-top:18px;padding-bottom:30px}
#side{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);background:#fff;z-index:40;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 24px;overflow:auto;transform:translateX(-105%);transition:transform .2s;border-right:1px solid var(--line)}
#side.open{transform:none}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;display:none}
#ov.on{display:block}
fieldset{border:0;padding:0;margin:0 0 18px}
legend{font-weight:600;margin-bottom:6px;padding:0}
.opt{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;cursor:pointer;min-height:34px}
.opt:hover{background:var(--soft)}
.opt input{width:17px;height:17px;accent-color:var(--brand)}
.opt i{margin-left:auto;font-style:normal;color:var(--mute);font-size:.85rem}
.sel{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:42px}
.head{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.head h1{font-size:1.35rem}
.head small{color:var(--mute);font-weight:400;font-family:"Source Sans 3",sans-serif;font-size:.95rem}
.list{display:grid;gap:10px}
.job{display:grid;grid-template-columns:56px 1fr auto;gap:14px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.job:hover{border-color:var(--brand);box-shadow:0 4px 18px rgba(15,118,110,.1)}
.lg{width:56px;height:56px;border-radius:12px;border:1px solid var(--line);object-fit:contain;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.4rem;font-family:"Bricolage Grotesque",sans-serif;color:#fff;border:0}
img.lg{border:1px solid var(--line);padding:4px}
.job h3{font-size:1.1rem;font-weight:600;overflow-wrap:anywhere}
.co{color:var(--mute);font-size:.95rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{background:var(--soft);padding:2px 10px;border-radius:999px;font-size:.84rem}
.tag.g{background:var(--tint);color:var(--brand-d);font-weight:600}
.side2{display:flex;flex-direction:column;align-items:flex-end;gap:6px;color:var(--mute);font-size:.85rem;white-space:nowrap}
.star{border:0;background:none;font-size:1.3rem;cursor:pointer;line-height:1;padding:6px;color:var(--mute)}
.star[aria-pressed=true]{color:#f59e0b}
.empty{padding:40px 16px;text-align:center;border:2px dashed var(--line);border-radius:14px;color:var(--mute)}
dialog{width:min(720px,calc(100vw - 20px));max-height:calc(100dvh - 20px);border:0;border-radius:16px;padding:0;color:var(--ink);background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg{padding:22px;display:grid;gap:14px}
.dh{display:flex;gap:14px;align-items:center}
.dh h2{font-size:1.4rem}
.desc{max-height:42vh;overflow:auto;padding-right:6px;color:#1f2937;overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mute);font-size:.9rem}
footer{border-top:1px solid var(--line);padding:18px 0 28px;color:var(--mute);font-size:.88rem}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
#toast.on{opacity:1}
.only-m{display:inline-flex}
@media(max-width:560px){.job{grid-template-columns:48px 1fr;gap:12px;padding:14px}.lg{width:48px;height:48px}.side2{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}.logo{font-size:1.2rem}#savedBtn span.t{display:none}}
@media(min-width:900px){.layout{display:grid;grid-template-columns:250px 1fr;gap:28px}#side{position:sticky;top:calc(78px + env(safe-area-inset-top,0px));inset:auto;width:auto;transform:none;z-index:1;padding:0;border:0;align-self:start;max-height:calc(100vh - 100px)}.only-m{display:none}#ov{display:none!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap bar0">
  <a class="logo" href="#top">Job<span>lane</span></a>
  <div class="sbox" role="search"><input id="q" type="search" placeholder="Search jobs, companies or skills" aria-label="Search jobs"></div>
  <button class="btn" id="savedBtn" aria-pressed="false">★ <span class="t">Saved</span> <b id="savedN">0</b></button>
</div></header>

<div class="wrap layout" id="top">
  <aside id="side" aria-label="Filters">
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><strong>Filters</strong><button class="btn only-m" id="closeF">Close</button></div>
    <label class="opt" style="margin-bottom:14px"><input type="checkbox" id="fRem"> Remote jobs only</label>
    <div id="filters"></div>
    <fieldset><legend>Posted</legend>
      <select class="sel" id="fDate" aria-label="Posted"><option value="0">Any time</option><option value="1">Last 24 hours</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select>
    </fieldset>
    <button class="btn" id="reset">Clear all filters</button>
  </aside>
  <div id="ov"></div>
  <section>
    <div class="head"><h1 id="resTitle">Latest jobs <small id="count"></small></h1><button class="btn only-m" id="fBtn">☰ Filters</button></div>
    <div class="list" id="list" aria-live="polite"></div>
    <div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="more">Show more jobs</button></div>
  </section>
</div>
<footer><div class="wrap"><span id="srcnote">Sample listings shown. Live jobs appear once jobs.json is connected.</span> Every listing links to the original posting.</div></footer>
<dialog id="dlg" aria-label="Job details"></dialog>
<div id="toast" role="status"></div>

<script>
const REG=["Remote","USA","UK","Canada","Europe","Pakistan","India","Other"];
const SRC={Remotive:"https://remotive.com",Arbeitnow:"https://www.arbeitnow.com",RemoteOK:"https://remoteok.com",Himalayas:"https://himalayas.app",Greenhouse:"https://www.greenhouse.com","Pakistan Govt":""};
const S=[
["Senior React Developer","Nexa Labs","USA","New York, USA","Software Development","Full-time",1,["React","TypeScript"],"Build customer dashboards for a fast-growing SaaS product.","Remotive",0,"USD 110,000–140,000"],
["Product Designer","Pixelhaus","UK","London, UK","Design","Full-time",0,["Figma","Research"],"Own design for mobile flows and test them with real users every sprint.","Himalayas",1,""],
["Customer Success Manager","Helpdesk Global","Remote","Worldwide","Customer Support","Full-time",1,["Zendesk","English"],"Help SaaS customers get value quickly and reduce churn.","Remotive",1,""],
["Data Analyst","Karachi Analytics","Pakistan","Karachi, Pakistan","Data & AI","Full-time",0,["SQL","Python"],"Build reports and dashboards for retail and fintech clients.","Pakistan Govt",2,"PKR 120,000–160,000"],
["Backend Engineer (Node)","Brightstack","Canada","Toronto, Canada","Software Development","Contract",1,["Node.js","PostgreSQL"],"Ship APIs for a fintech client on a six-month contract.","RemoteOK",3,"CAD 90–120/hr"],
["Content Marketing Lead","Rankwise","Europe","Berlin, Germany","Marketing","Full-time",1,["SEO","Writing"],"Plan and publish search-focused content and track rankings.","Arbeitnow",4,""],
["Assistant Director (BS-17)","Federal Department","Pakistan","Islamabad, Pakistan","Government","Full-time",0,["Public sector"],"Sample government listing. Add real ones in gov-jobs.json.","Pakistan Govt",6,"BPS-17"],
["DevOps Engineer","CloudNine","India","Bengaluru, India","Software Development","Full-time",1,["Docker","AWS"],"Own deployment pipelines and monitoring for a distributed team.","Himalayas",9,""]
].map((a,i)=>({id:i+1,title:a[0],company:a[1],logo:"",region:a[2],location:a[3],category:a[4],type:a[5],remote:!!a[6],skills:a[7],summary:a[8],description:a[8],source:a[9],apply:SRC[a[9]]||"#",age:a[10],salary:a[11]}));
let J=S;const F={region:"",category:"",type:""};let LIMIT=20,onlySaved=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let saved=store.get("jl_saved",[]);
const live=()=>J.filter(j=>j.age<=45);
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2400)}
function ago(d){return d<=0?"Today":d===1?"Yesterday":d<14?d+" days ago":Math.floor(d/7)+" weeks ago"}
const COL=["#0f766e","#1d4ed8","#b45309","#7c3aed","#be123c","#047857","#0369a1","#a21caf"];
function logo(j){const c=(j.company||"?").trim(),col=COL[c.charCodeAt(0)%COL.length];
 const ini=`<div class="lg" style="background:${col}">${esc(c[0]||"?").toUpperCase()}</div>`;
 return j.logo&&/^https?:/.test(j.logo)?`<img class="lg" src="${esc(j.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-ini="${esc(c[0]||"?")}" data-col="${col}">`:ini}
document.addEventListener("error",e=>{const i=e.target;if(i.tagName==="IMG"&&i.dataset.ini){const d=document.createElement("div");d.className="lg";d.style.background=i.dataset.col;d.textContent=i.dataset.ini.toUpperCase();i.replaceWith(d)}},true);
function counts(k){const m={};live().forEach(j=>m[j[k]]=(m[j[k]]||0)+1);return m}
function group(title,key,order){const m=counts(key);let ks=order?order.filter(k=>m[k]):Object.keys(m).sort((a,b)=>m[b]-m[a]);
 return `<fieldset><legend>${title}</legend><label class="opt"><input type="radio" name="${key}" value=""${F[key]===""?" checked":""}> All <i>${live().length}</i></label>`+ks.map(k=>`<label class="opt"><input type="radio" name="${key}" value="${esc(k)}"${F[key]===k?" checked":""}> ${esc(k)} <i>${m[k]}</i></label>`).join("")+"</fieldset>"}
function buildFilters(){$("filters").innerHTML=group("Location","region",REG)+group("Category","category")+group("Job type","type")}
function filtered(){const q=$("q").value.trim().toLowerCase(),d=+$("fDate").value,r=$("fRem").checked;
 return live().filter(j=>(!q||[j.title,j.company,j.summary,(j.skills||[]).join(" "),j.location].join(" ").toLowerCase().includes(q))&&(!F.region||j.region===F.region)&&(!F.category||j.category===F.category)&&(!F.type||j.type===F.type)&&(!d||j.age<=d)&&(!r||j.remote)&&(!onlySaved||saved.includes(j.id))).sort((a,b)=>a.age-b.age)}
function card(j){const s=saved.includes(j.id);
 return `<article class="job" data-open="${j.id}" tabindex="0" role="button" aria-label="${esc(j.title)} at ${esc(j.company)}">${logo(j)}
 <div><h3>${esc(j.title)}</h3><div class="co">${esc(j.company)}</div>
 <div class="tags">${j.remote?'<span class="tag g">Remote</span>':""}<span class="tag">${esc(j.location||j.region)}</span><span class="tag">${esc(j.type)}</span><span class="tag">${esc(j.category)}</span>${j.salary?`<span class="tag">${esc(j.salary)}</span>`:""}</div></div>
 <div class="side2"><button class="star" data-save="${j.id}" aria-pressed="${s}" aria-label="Save job">${s?"★":"☆"}</button><span>${ago(j.age)}</span></div></article>`}
function render(){const a=filtered();$("count").textContent=a.length+(a.length===1?" job":" jobs");
 $("resTitle").firstChild.textContent=onlySaved?"Saved jobs ":"Latest jobs ";
 $("list").innerHTML=a.length?a.slice(0,LIMIT).map(card).join(""):'<div class="empty"><strong>No jobs match these filters.</strong><br>Try clearing a filter or searching a different word.</div>';
 $("more").hidden=a.length<=LIMIT;$("savedN").textContent=saved.length;$("savedBtn").setAttribute("aria-pressed",onlySaved)}
function openJob(id,push=true){const j=J.find(x=>x.id===id);if(!j)return;
 let el=$("ld");if(el)el.remove();
 if(j.source!=="Himalayas"){el=document.createElement("script");el.type="application/ld+json";el.id="ld";
  const ld={"@context":"https://schema.org/","@type":"JobPosting",title:j.title,description:j.summary,datePosted:new Date(Date.now()-j.age*864e5).toISOString().slice(0,10),validThrough:new Date(Date.now()+30*864e5).toISOString().slice(0,10),hiringOrganization:{"@type":"Organization",name:j.company},jobLocation:{"@type":"Place",address:{"@type":"PostalAddress",addressLocality:j.location||j.region}},directApply:false};
  if(j.remote)ld.jobLocationType="TELECOMMUTE";el.textContent=JSON.stringify(ld);document.head.appendChild(el)}
 const link=/^https?:/.test(j.apply||"")?j.apply:"#",sl=SRC[j.source];
 $("dlg").innerHTML=`<div class="dlg"><div class="row" style="justify-content:flex-end"><button class="btn" data-close>✕ Close</button></div>
 <div class="dh">${logo(j)}<div><h2>${esc(j.title)}</h2><div class="co">${esc(j.company)}</div></div></div>
 <div class="tags">${j.remote?'<span class="tag g">Remote</span>':""}<span class="tag">${esc(j.location||j.region)}</span><span class="tag">${esc(j.type)}</span><span class="tag">${esc(j.category)}</span>${j.salary?`<span class="tag">${esc(j.salary)}</span>`:""}<span class="tag">${ago(j.age)}</span></div>
 ${(j.skills||[]).length?`<div class="tags">${j.skills.map(k=>`<span class="tag">${esc(k)}</span>`).join("")}</div>`:""}
 <div class="desc">${esc(j.description||j.summary).replace(/\n/g,"<br>")}</div>
 <p class="muted">Source: ${sl?`<a href="${sl}" target="_blank" rel="noopener">${esc(j.source)}</a>`:esc(j.source)}. This is an excerpt, read the full posting on the original site.</p>
 <div class="row"><a class="btn p" href="${esc(link)}" target="_blank" rel="noopener nofollow">Apply on ${esc(j.source)} ↗</a><button class="btn" data-save="${j.id}" data-d="1">${saved.includes(j.id)?"★ Saved":"☆ Save"}</button><button class="btn" data-share>Share</button></div></div>`;
 if(!$("dlg").open)$("dlg").showModal();if(push)try{history.replaceState(null,"","#job-"+id)}catch(e){}}
function drawer(on){$("side").classList.toggle("open",on);$("ov").classList.toggle("on",on)}
document.addEventListener("click",e=>{const sv=e.target.closest("[data-save]");
 if(sv){e.stopPropagation();const id=+sv.dataset.save;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];store.set("jl_saved",saved);render();if(sv.dataset.d)openJob(id,false);toast(saved.includes(id)?"Job saved":"Removed from saved");return}
 if(e.target.closest("[data-close]")){$("dlg").close();return}
 if(e.target.closest("[data-share]")){(navigator.clipboard?navigator.clipboard.writeText(location.href):Promise.reject()).then(()=>toast("Link copied"),()=>toast("Copy the address bar link to share"));return}
 const c=e.target.closest("[data-open]");if(c&&!e.target.closest("a"))openJob(+c.dataset.open)});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".job")){e.preventDefault();openJob(+e.target.dataset.open)}});
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close()});
$("dlg").addEventListener("close",()=>{try{history.replaceState(null,"","#top")}catch(e){}});
$("filters").addEventListener("change",e=>{F[e.target.name]=e.target.value;LIMIT=20;render()});
["q","fDate","fRem"].forEach(i=>$(i).addEventListener("input",()=>{LIMIT=20;render()}));
$("reset").onclick=()=>{F.region=F.category=F.type="";$("q").value="";$("fDate").value="0";$("fRem").checked=false;onlySaved=false;LIMIT=20;buildFilters();render()};
$("more").onclick=()=>{LIMIT+=20;render()};
$("savedBtn").onclick=()=>{onlySaved=!onlySaved;LIMIT=20;render();window.scrollTo({top:0,behavior:"smooth"})};
$("fBtn").onclick=()=>drawer(true);$("closeF").onclick=()=>drawer(false);$("ov").onclick=()=>drawer(false);
function boot(){buildFilters();render();const m=location.hash.match(/^#job-(\d+)$/);if(m)openJob(+m[1],false)}
fetch("jobs.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
 if(!Array.isArray(d)||!d.length)throw 0;
 J=d.map((j,i)=>({...j,id:i+1,skills:j.skills||[],region:j.region||"Other",category:j.category||"Other",type:j.type||"Full-time",age:Math.max(0,Math.floor((Date.now()-new Date(j.posted))/864e5))}));
 const s=[...new Set(J.map(j=>j.source))].join(", ");$("srcnote").textContent="Jobs from "+s+", refreshed every 3 hours.";
}).catch(()=>{}).finally(boot);
</script>
</body>
</html>
